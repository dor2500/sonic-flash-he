# GitHub Pages: web/ from the repo + game.swf and Ruffle from the latest release's sonic_flash_he_web.zip
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assets from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'sonic_flash_he_web.zip' --dir /tmp
          unzip -q /tmp/sonic_flash_he_web.zip -d site
          cp -r web/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
